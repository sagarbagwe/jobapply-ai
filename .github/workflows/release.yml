name: release
on:
  push:
    tags: ['v*']
permissions: {contents: write, packages: write}
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: extension/package-lock.json}
      - run: npm ci && npm run build
        working-directory: extension
        env: {VITE_API_BASE_URL: "https://api.jobapply.ai/v1"}
      - run: cd extension/dist && zip -r ../../jobapply-ai-extension.zip .
      - uses: softprops/action-gh-release@v2
        with: {files: jobapply-ai-extension.zip, generate_release_notes: true}
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jobapply-ai-api:${{ github.ref_name }}
