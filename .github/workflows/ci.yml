name: ci
on: [push, pull_request]
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  extension:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: extension}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: extension/package-lock.json}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: {name: jobapply-ai-extension, path: extension/dist, if-no-files-found: error}
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: jobapply, POSTGRES_PASSWORD: jobapply, POSTGRES_DB: jobapply}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobapply" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25', cache-dependency-path: backend/go.sum}
      - run: go mod download
      - name: Validate migrations
        env: {PGPASSWORD: jobapply}
        run: |
          for f in migrations/*.sql; do psql -h localhost -U jobapply -d jobapply -v ON_ERROR_STOP=1 -f "$f"; done
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./cmd/api
  docker:
    runs-on: ubuntu-latest
    needs: [extension, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with: {context: backend, push: false, tags: jobapply-ai-api:test}
